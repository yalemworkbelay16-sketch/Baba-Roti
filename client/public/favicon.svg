<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Deep Espresso & Coffee Burgundy Gradient -->
    <linearGradient id="brBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450f0f"/>
      <stop offset="50%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#190404"/>
    </linearGradient>

    <!-- Luxury Gold & Caramel Gradient -->
    <linearGradient id="brGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Bun Crust Gradient -->
    <linearGradient id="brBunGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Steam Accent Gradient -->
    <linearGradient id="brSteamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="brGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#brBgGrad)"/>
  
  <!-- Outer Gold Stroke -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#brGoldGrad)" stroke-width="1.8"/>

  <!-- Top Sparkle -->
  <path d="M51 10 L52 13 L55 14 L52 15 L51 18 L50 15 L47 14 L50 13 Z" fill="#fde68a"/>

  <!-- Aroma Steam Wisps -->
  <path d="M26 18 Q23 13 27 9" stroke="url(#brSteamGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M32 17 Q36 12 33 7" stroke="url(#brSteamGrad)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M38 18 Q42 14 39 9" stroke="url(#brSteamGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Signature Roti Coffee Bun Dome -->
  <path d="M17 38 C17 25 23 19 32 19 C41 19 47 25 47 38 Z" fill="url(#brBunGrad)" filter="url(#brGlow)"/>

  <!-- Bun Swirl Piping -->
  <path d="M23 37 Q25 24 32 23 Q39 24 41 37" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M27 36 Q29 27 32 26 Q35 27 37 36" fill="none" stroke="#fde68a" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>

  <!-- Espresso Cup Body -->
  <path d="M21 39 L24 49 C24.5 52.5 28 54 32 54 C36 54 39.5 52.5 40 49 L43 39 Z" fill="#ffffff"/>

  <!-- Cup Handle -->
  <path d="M42 41 C46 41 47 43 47 46 C47 48.5 45.5 50 41 50" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Coffee Cup Gold Band -->
  <path d="M22.5 43.5 L41.5 43.5" stroke="url(#brGoldGrad)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Saucer -->
  <path d="M18 55 C22 58 42 58 46 55" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M23 57 C27 59 37 59 41 57" fill="none" stroke="url(#brGoldGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
